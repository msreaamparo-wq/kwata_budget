name: kwarta_budget_tracker
description: Offline-first personal budget tracker with SQLite and Supabase cloud sync.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.18.3
  sqflite: ^2.4.6
  path: ^1.9.1
  connectivity_plus: ^7.3.2
  intl: ^0.20.2
  uuid: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
